<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <video id="webcam-preview" autoplay muted playsinline aria-hidden="true"></video>
  <canvas id="webcam-canvas"></canvas>
  <div id="menu">
    <div class="menu-content">
      <h1>MAZE_3D // INITIALIZING</h1>
      <div class="menu-options">
        <div class="option">
          <label>SIZE</label>
          <select id="size-select">
            <option value="14">14 x 14</option>
            <option value="25">25 x 25</option>
          </select>
        </div>
        <div class="option">
          <label>GOAL</label>
          <select id="goal-select">
            <option value="corner">CORNER</option>
            <option value="center">CENTER</option>
          </select>
        </div>
        <div class="option">
          <label>CONTROL MODE</label>
          <select id="control-mode-select">
            <option value="grab">PINCH TO GRAB</option>
            <option value="hover">HOVER PUSH</option>
          </select>
        </div>
        <div class="option">
          <label>BALL COLOR</label>
          <select id="ball-color-select">
            <option value="#eeeeee">WHITE</option>
            <option value="#ff4444">RED</option>
            <option value="#4488ff">BLUE</option>
            <option value="#44ff88">GREEN</option>
            <option value="#ffaa00">ORANGE</option>
          </select>
        </div>
        <div class="option">
          <label>MAZE COLOR</label>
          <select id="maze-color-select">
            <option value="#c8a46e">WOOD</option>
            <option value="#888888">GREY</option>
            <option value="#4466ff">BLUE</option>
            <option value="#aa44ff">PURPLE</option>
            <option value="#ff6644">ORANGE</option>
            <option value="#44ffaa">TEAL</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="calibrate-btn" class="secondary-btn" style="flex: 1;">CALIBRATE</button>
        <button id="start-btn" style="flex: 2;">START_GAME</button>
      </div>
    </div>
  </div>
  <div id="calibration-screen" style="display: none;" class="menu-overlay">
    <div class="menu-content">
      <h1>CALIBRATION</h1>
      <p id="calibration-step-text" style="color: rgba(255,255,255,0.8); line-height: 1.5;">Hold your <b style="color:#00ffff;">LEFT</b> hand at the <b>MAXIMUM</b> push depth (closest to camera) and use your other hand to click CONFIRM.</p>
      <div style="font-size: 2.5rem; color: #00ff99; text-align: center; margin: 20px 0;" id="calib-size-display">0.000</div>
      <button id="calib-confirm-btn">CONFIRM LEFT HAND</button>
    </div>
  </div>
  <div id="hud">
    <div id="webcam-badge" class="hud-badge"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
